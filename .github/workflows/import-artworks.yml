name: Save Authorized Artwork Images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-artworks.yml','scripts/import_artworks.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow==11.3.0
      - name: Download verified images, optimize and update exhibit
        run: python scripts/import_artworks.py
      - name: Commit authorized artwork images and catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/artists.json data/image_report.json assets/artworks/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified artwork images to Daegu Art 40 gallery"
            git push origin main
          fi
